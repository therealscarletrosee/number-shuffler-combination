<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Number Combination</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #0f0f14;
        color: #fff;
        padding: 30px;
    }
    h1 {
        text-align: center;
    }
    .group {
        margin-bottom: 15px;
        position: relative;
    }
    textarea {
        width: 100%;
        height: 60px;
        background: #1a1a25;
        color: #fff;
        border: 1px solid #444;
        padding: 10px;
        border-radius: 6px;
        resize: vertical;
        box-sizing: border-box;
    }
    .delete-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        background: #e74c3c;
        border: none;
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
    }
    .delete-btn:hover {
        background: #ff6b5a;
    }
    button {
        background: #6c5ce7;
        border: none;
        padding: 10px 16px;
        color: white;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
    }
    button:hover {
        background: #8579ff;
    }
    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 20px;
        align-items: center;
    }
    .output-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 20px;
        justify-content: flex-start;
    }
    .combo-section {
        flex: 1;
        min-width: 280px;
        background: #1a1a25;
        padding: 15px;
        border-radius: 8px;
        max-height: 70vh;
        overflow-y: auto;
    }
    .section-title {
        font-weight: bold;
        color: #a29bfe;
        font-size: 18px;
        text-align: center;
        margin-bottom: 10px;
    }
    .combo-list {
        font-family: monospace;
        white-space: pre;
        line-height: 1.6;
        font-size: 15px;
    }
    .info {
        font-size: 14px;
        color: #aaa;
        margin-top: 10px;
        text-align: center;
    }
    .shuffler {
        background: #27ae60;
    }
    .shuffler:hover {
        background: #2ecc71;
    }
    .clear-btn {
        background: #95a5a6;
    }
    .clear-btn:hover {
        background: #bdc3c7;
        color: #000;
    }
    .save-output {
        background: #ff00e6;
    }
    .save-status {
        font-size: 12px;
        color: #2ecc71;
        margin-left: 10px;
        opacity: 0;
        transition: opacity 0.3s;
    }
</style>
</head>
<body>
<h1>Number Shuffler</h1>
<div id="groups"></div>

<div class="controls">
    <button onclick="addGroup()">Add Group</button>
    <button onclick="rumble()" class="shuffler">Shuffle</button>
    <button onclick="clearOutput()" class="clear-btn">Clear Output</button>
    <button onclick="saveOutput()" class="save-output">Save Output</button>
    <button onclick="clearAllData()" style="background:#e67e22;">Clear All Saved Data</button>
    <span class="save-status" id="saveStatus">Saved!</span>
</div>

<div class="info">
    All numbers from all groups are combined (full multiset, duplicates preserved).<br>
    Generates <strong>all distinct ordered arrangements</strong> (permutations) for every size from highest down to 2.
</div>

<div class="output-container" id="output-container">
</div>

<script>
const STORAGE_KEY = 'numberShufflerGroups';

function saveGroups() {
    const textareas = document.querySelectorAll("#groups textarea");
    const data = Array.from(textareas).map(t => t.value.trim());
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    const status = document.getElementById("saveStatus");
    status.style.opacity = '1';
    setTimeout(() => status.style.opacity = '0', 1000);
}

function loadGroups() {
    const container = document.getElementById("groups");
    container.innerHTML = '';
    let saved = localStorage.getItem(STORAGE_KEY);
    let groups = [''];
    if (saved) {
        try { groups = JSON.parse(saved); } catch (e) { groups = ['']; }
    }
    groups.forEach(content => addGroup(content));
}

function addGroup(initialContent = '') {
    const div = document.createElement("div");
    div.className = "group";
    div.innerHTML = `
        <button class="delete-btn" onclick="removeGroup(this)">✕</button>
        <textarea placeholder="Enter numbers">${initialContent}</textarea>
    `;
    document.getElementById("groups").appendChild(div);
    div.querySelector("textarea").addEventListener('input', saveGroups);
    saveGroups();
}

function removeGroup(btn) {
    btn.parentElement.remove();
    saveGroups();
}

function clearAllData() {
    if (confirm("Delete all saved groups permanently?")) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
    }
}

function parseNumbers(input) {
    if (!input.trim()) return [];
    return input.trim().split(/[\s,]+/)
        .map(s => s.trim())
        .filter(s => s !== '' && !isNaN(s))
        .map(Number);
}

// Get multiset of all numbers
function getMultiset() {
    const textareas = document.querySelectorAll("#groups textarea");
    const all = [];
    textareas.forEach(t => all.push(...parseNumbers(t.value)));
    return all.sort((a,b) => a - b);
}

// Generate all distinct permutations of length k from multiset
function getDistinctPermutations(arr, k) {
    const result = new Set();
    
    function backtrack(current, remaining) {
        if (current.length === k) {
            result.add(current.join("-"));
            return;
        }
        const seen = new Set();
        for (let i = 0; i < remaining.length; i++) {
            const num = remaining[i];
            if (seen.has(num)) continue;
            seen.add(num);
            backtrack([...current, num], [...remaining.slice(0, i), ...remaining.slice(i + 1)]);
        }
    }
    
    backtrack([], arr);
    return [...result].sort();
}

function rumble() {
    const multiset = getMultiset();
    if (multiset.length === 0) {
        alert("Please enter some numbers.");
        return;
    }

    let maxGroupSize = 0;
    document.querySelectorAll("#groups textarea").forEach(t => {
        const len = parseNumbers(t.value).length;
        if (len > maxGroupSize) maxGroupSize = len;
    });

    const container = document.getElementById("output-container");
    container.innerHTML = '';

    const MAX_DISPLAY = 50000;

    for (let size = maxGroupSize; size >= 2; size--) {
        if (multiset.length < size) continue;

        const perms = getDistinctPermutations(multiset, size);
        const total = perms.length;

        const section = document.createElement("div");
        section.className = "combo-section";

        const title = document.createElement("div");
        title.className = "section-title";
        title.textContent = `Combinations of ${size} (${total.toLocaleString()} total)`;

        const list = document.createElement("div");
        list.className = "combo-list";

        if (total > MAX_DISPLAY) {
            list.textContent = perms.slice(0, MAX_DISPLAY).join("\n") +
                `\n\n... and ${(total - MAX_DISPLAY).toLocaleString()} more not shown`;
        } else {
            list.textContent = perms.join("\n");
        }

        section.appendChild(title);
        section.appendChild(list);
        container.appendChild(section);
    }
}

function clearOutput() {
    document.getElementById("output-container").innerHTML = '';
}

function saveOutput() {
    const sections = document.querySelectorAll(".combo-section");
    if (sections.length === 0) {
        alert("Run Shuffle first.");
        return;
    }
    let text = "";
    sections.forEach(sec => {
        const title = sec.querySelector(".section-title").textContent;
        const list = sec.querySelector(".combo-list").textContent;
        text += title + "\n" + list + "\n\n";
    });
    const blob = new Blob([text], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "ordered-combinations.txt";
    a.click();
    URL.revokeObjectURL(url);
}

window.onload = loadGroups;
</script>
</body>
</html>
