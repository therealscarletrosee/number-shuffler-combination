<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Number Shuffler</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #0f0f14;
        color: #fff;
        padding: 30px;
    }

    h1 {
        text-align: center;
    }

    .group {
        margin-bottom: 15px;
        position: relative;
    }

    textarea {
        width: 100%;
        height: 60px;
        background: #1a1a25;
        color: #fff;
        border: 1px solid #444;
        padding: 10px;
        border-radius: 6px;
        resize: vertical;
    }

    .delete-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        background: #e74c3c;
        border: none;
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
    }

    .delete-btn:hover {
        background: #ff6b5a;
    }

    button {
        background: #6c5ce7;
        border: none;
        padding: 10px 16px;
        color: white;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
    }

    button:hover {
        background: #8579ff;
    }

    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
        align-items: center;
    }

    .output {
        margin-top: 20px;
        padding: 15px;
        background: #1a1a25;
        border-radius: 8px;
        min-height: 40px;
        font-size: 16px;
        white-space: pre-line;
        max-height: 70vh;
        overflow-y: auto;
    }

    .info {
        font-size: 14px;
        color: #aaa;
        margin-top: 10px;
    }

    .shuffler {
        background: #27ae60;
    }

    .shuffler:hover {
        background: #2ecc71;
    }

    .clear-btn {
        background: #95a5a6;
    }

    .clear-btn:hover {
        background: #bdc3c7;
        color: #000;
    }

    .save-output {
        background: #ff00e6;
    }

    .save-status {
        font-size: 12px;
        color: #2ecc71;
        margin-left: 10px;
        opacity: 0;
        transition: opacity 0.3s;
    }
</style>
</head>
<body>

<h1>Number Shuffler</h1>

<div id="groups">
    <!-- Groups will be loaded from localStorage or start with defaults -->
</div>

<div class="controls">
    <button onclick="addGroup()">Add Group</button>
    <button onclick="rumble()" class="shuffler">Shuffle</button>
    <button onclick="clearOutput()" class="clear-btn">Clear Output</button>
    <button onclick="saveOutput()"class="save-output">Save Output</button>
    <button onclick="clearAllData()" style="background:#e67e22;">Clear All Saved Data</button>
    <span class="save-status" id="saveStatus">Saved!</span>
</div>

<div class="info">
    Supports input with <strong>spaces</strong> or <strong>commas</strong> (or mixed).<br>
    Your groups are <strong>automatically saved</strong> in your browser.<br>
</div>

<div class="output" id="output">
    Click "Shuffle" to generate all possible combinations...
</div>

<script>
// Key for localStorage
const STORAGE_KEY = 'numberShufflerGroups';

// Save all groups to localStorage
function saveGroups() {
    const textareas = document.querySelectorAll("#groups textarea");
    const data = Array.from(textareas).map(t => t.value);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    
    // Show brief "Saved!" feedback
    const status = document.getElementById("saveStatus");
    status.style.opacity = '1';
    setTimeout(() => { status.style.opacity = '0'; }, 1000);
}

// Load groups from localStorage
function loadGroups() {
    const saved = localStorage.getItem(STORAGE_KEY);
    const container = document.getElementById("groups");
    container.innerHTML = ''; // Clear defaults

    let groups = [];
    if (saved) {
        try {
            groups = JSON.parse(saved);
        } catch (e) {
            groups = [];
        }
    }

    // If nothing saved, start with 2 empty groups
    if (groups.length === 0) {
        groups = ['', ''];
    }

    groups.forEach(content => {
        addGroup(content);
    });
}

// Add a new group (with optional initial content)
function addGroup(initialContent = '') {
    const div = document.createElement("div");
    div.className = "group";
    div.innerHTML = `
        <button class="delete-btn" onclick="removeGroup(this)">✕</button>
        <textarea placeholder="Enter number">${initialContent}</textarea>
    `;
    document.getElementById("groups").appendChild(div);

    // Attach input listener for auto-save
    const textarea = div.querySelector("textarea");
    textarea.addEventListener('input', saveGroups);

    // Save immediately after adding
    saveGroups();
}

function removeGroup(button) {
    button.parentElement.remove();
    saveGroups();
}

// Clear all saved data (optional button)
function clearAllData() {
    if (confirm("Are you sure? This will delete all your saved groups permanently.")) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
    }
}

// Improved number parsing
function parseNumbers(input) {
    return input
        .split(/[\s,]+/)
        .map(v => v.trim())
        .filter(v => v !== "" && !isNaN(v))
        .map(Number);
}

// Generate combinations
function combinations(arr, size) {
    if (size === 0) return [[]];
    if (arr.length < size) return [];

    const result = [];
    const combo = [];

    function backtrack(start) {
        if (combo.length === size) {
            result.push([...combo]);
            return;
        }
        for (let i = start; i < arr.length; i++) {
            combo.push(arr[i]);
            backtrack(i + 1);
            combo.pop();
        }
    }

    backtrack(0);
    return result;
}

function rumble() {
    const textareas = document.querySelectorAll("#groups textarea");
    let numbers = [];

    textareas.forEach(t => {
        numbers.push(...parseNumbers(t.value));
    });

    numbers = [...new Set(numbers)].sort((a, b) => a - b);

    const output = document.getElementById("output");

    if (numbers.length < 2) {
        output.textContent = "Need at least 2 unique numbers to form combinations.";
        return;
    }

    let resultText = `Total unique numbers: ${numbers.length}\n\n`;
    let hasAny = false;

    const maxCombsPerSize = 1000;

    if (numbers.length >= 4) {
        const combs4 = combinations(numbers, 4);
        if (combs4.length > maxCombsPerSize) {
            resultText += `Combinations of 4: Too many (${combs4.length.toLocaleString()}), skipped to avoid overload.\n\n`;
        } else if (combs4.length > 0) {
            resultText += `Combinations of 4 (${combs4.length} total):\n`;
            combs4.forEach(c => resultText += c.join(" ") + "\n");
            resultText += "\n";
            hasAny = true;
        }
    }

    if (numbers.length >= 3) {
        const combs3 = combinations(numbers, 3);
        if (combs3.length > maxCombsPerSize) {
            resultText += `Combinations of 3: Too many (${combs3.length.toLocaleString()}), skipped.\n\n`;
        } else if (combs3.length > 0) {
            resultText += `Combinations of 3 (${combs3.length} total):\n`;
            combs3.forEach(c => resultText += c.join(" ") + "\n");
            resultText += "\n";
            hasAny = true;
        }
    }

    if (numbers.length >= 2) {
        const combs2 = combinations(numbers, 2);
        resultText += `Combinations of 2 (${combs2.length} total):\n`;
        combs2.forEach(c => resultText += c.join(" ") + "\n");
        hasAny = true;
    }

    if (!hasAny) {
        resultText += "No combinations generated (possibly due to limits).";
    }

    output.textContent = resultText.trim();
}

function clearOutput() {
    document.getElementById("output").textContent = "Output cleared. Ready for next shuffle!";
}

function saveOutput() {
    const text = document.getElementById("output").textContent;

    if (!text || text.includes("Click \"Shuffle\"") || text.includes("cleared") || text.includes("Need at least")) {
        alert("Nothing meaningful to save yet. Run Shuffle first.");
        return;
    }

    const blob = new Blob([text], { type: "text/plain" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "shuffled-combinations.txt";
    a.click();

    URL.revokeObjectURL(url);
}

// Load saved groups when page loads
window.onload = function() {
    loadGroups();
};
</script>

</body>
</html>
